<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShopFlow">
<meta name="theme-color" content="#12110f">
<title>ShopFlow - Mobile Job Board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="shopflow-apple-touch-icon.png">
<link rel="icon" href="shopflow-icon-192.png" type="image/png">
<script>
try {
  var _sfTheme = JSON.parse(localStorage.getItem('shopflow_data') || '{}').theme;
  if (_sfTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
} catch (e) {}
</script>
<style>
  :root {
    --bg: #12110f;
    --surface: #1a1916;
    --surface-2: #23221e;
    --border: #33322c;
    --text: #f2efe8;
    --text-dim: #9a958a;
    --accent: #e3a31a;
    --urgent: #c85a4a;
    --success: #6f8f6a;
    --radius: 10px;
    --header-bg: rgba(18, 17, 15, 0.94);
    --tabbar-bg: rgba(18, 17, 15, 0.96);
    --overlay: rgba(0, 0, 0, 0.62);
    --tabbar-h: 56px;
    --page-w: 480px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f3efe6;
    --surface: #fbf8f2;
    --surface-2: #ebe6db;
    --border: #d4cfc2;
    --text: #1c1a16;
    --text-dim: #6b665c;
    --header-bg: rgba(243, 239, 230, 0.94);
    --tabbar-bg: rgba(251, 248, 242, 0.96);
    --overlay: rgba(28, 26, 22, 0.4);
    color-scheme: light;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 12px);
    overflow-x: hidden;
    font-weight: 500;
  }
  .header {
    background: var(--header-bg);
    padding: calc(8px + var(--safe-top)) 16px 8px;
    position: sticky; top:0; z-index:100;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    max-width: var(--page-w); margin: 0 auto;
  }
  .logo {
    display:flex; align-items:center; gap:8px;
    font-size:17px; font-weight:600; letter-spacing:-0.03em; line-height:1;
  }
  .logo img { width:22px; height:22px; border-radius:6px; }
  .header-right { display:flex; align-items:center; gap:8px; position:relative; }
  .text-btn {
    background: var(--accent); border:none; color:#1a1406;
    font: inherit; font-size:14px; font-weight:600;
    min-height:36px; padding: 0 14px; border-radius: 999px; cursor:pointer;
  }
  .text-btn:active { transform: scale(0.98); opacity:0.9; }
  .text-btn[hidden] { display:none !important; }
  .text-btn-ghost {
    background: transparent; color: var(--text); border: 1px solid var(--border);
  }
  .text-btn-danger {
    background: transparent; color: var(--urgent); border: 1px solid var(--border);
  }
  .text-btn-danger:disabled { opacity: 0.4; }
  .icon-btn {
    background:none; border:none;
    width:44px; height:44px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); cursor:pointer; font-size:20px; font-weight:600;
  }
  .icon-btn[hidden] { display:none !important; }
  .header-menu {
    display:none; position:absolute; right:0; top:calc(100% + 6px);
    background: var(--surface); border:1px solid var(--border);
    border-radius: 10px; min-width: 188px; overflow:hidden; z-index:120;
  }
  .header-menu.open { display:block; }
  .header-menu button {
    width:100%; text-align:left; background:none; border:none;
    color: var(--text); font: inherit; font-weight:500; font-size:15px;
    padding: 14px 16px; cursor:pointer; min-height:44px;
  }
  .header-menu button + button { border-top: 1px solid var(--border); }
  .header-menu button:active { background: var(--surface-2); }
  .section { display:none; padding: 16px; animation: fadeIn 0.18s ease; }
  .section.active { display:block; max-width: var(--page-w); margin: 0 auto; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .job-group { margin-bottom: 26px; }
  .group-title {
    font-size:12px; font-weight:600; margin: 0 0 8px;
    display:flex; align-items:center; gap:8px; color: var(--text-dim);
  }
  .group-title .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; background: var(--text-dim); }
  .group-title .n { font-weight:500; }
  .dot-onsite { background: var(--success); }

  .card {
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); padding: 16px 16px 10px; margin-bottom: 10px;
    position:relative;
  }
  .card-top {
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  }
  .card-identity { font-size:17px; font-weight:600; line-height:1.25; letter-spacing:-0.02em; }
  .who {
    flex-shrink:0; color: var(--text-dim); font-size:13px; font-weight:500;
    padding-top: 2px; max-width: 42%;
  }
  .card-when {
    margin-top:6px; font-size:15px; font-weight:500; color: var(--text);
  }
  .card-when.overdue { color: var(--urgent); }
  .card-where {
    margin-top:3px; font-size:14px; font-weight:500; color: var(--text-dim);
    line-height:1.35;
  }
  .card-job {
    margin-top:10px; font-size:15px; font-weight:500; line-height:1.4; color: var(--text);
  }
  .urgent-mark {
    margin-top:8px; font-size:13px; font-weight:600; color: var(--urgent);
  }
  .card-links {
    display:flex; align-items:center; gap:0; margin-top:10px;
  }
  .card-links a {
    color: var(--text-dim); font-size:14px; font-weight:600;
    text-decoration:none; min-height:44px; display:flex; align-items:center;
  }
  .card-links a + a::before {
    content: '';
    width: 1.5px;
    height: 1em;
    background: var(--border);
    margin: 0 12px;
    flex-shrink: 0;
  }
  .card-links a:active { color: var(--accent); }
  .card-actions { display:flex; gap:8px; margin-top:6px; }
  .card-details { display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .card.expanded .card-details { display:block; }
  .card-notes {
    padding:12px; border-radius:8px;
    background: var(--surface-2);
    font-size:14px; color: var(--text-dim); line-height:1.45; margin-bottom:10px;
  }
  .card-tools { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .tool-tag {
    background: var(--surface-2);
    padding:5px 9px; border-radius:6px; font-size:12px; color: var(--text-dim); font-weight:500;
  }
  .details-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .details-actions .btn { flex:1 1 40%; }
  .details-toggle {
    width:auto; margin-top:2px; min-height:40px; padding:0;
    background:none; border:none; color: var(--text-dim);
    font: inherit; font-size:13px; font-weight:500; cursor:pointer;
  }
  .card.expanded .details-toggle { color: var(--text); }

  .btn {
    flex:1; min-height:46px; padding:12px 14px; border-radius:10px; border:none;
    font-size:15px; font-weight:600; cursor:pointer; text-align:center;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; color: inherit;
  }
  .btn-primary { background: var(--accent); color:#1a1406; }
  .btn-ghost { background: transparent; color: var(--text); border:1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--urgent); border:1px solid var(--border); }
  .btn:active { transform: scale(0.98); opacity:0.9; }
  .btn-sm { min-height:42px; padding:10px 12px; flex:0 0 auto; font-size:13px; font-weight:600; }

  .tools-reset-row {
    display:flex; justify-content:flex-end; margin-bottom:8px;
  }
  .tools-reset-row .btn { flex:0 0 auto; min-width:72px; }

  .tool-cat {
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); margin-bottom:10px; overflow:hidden;
  }
  .tool-cat-header {
    padding:14px 16px;
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; font-weight:600; font-size:15px; min-height:52px;
  }
  .tool-cat-header::after {
    content: '›'; font-size:22px; line-height:1; color: var(--text-dim);
    transform: rotate(90deg); transition: transform 0.15s;
  }
  .tool-cat.collapsed .tool-cat-header::after { transform: rotate(0deg); }
  .tool-cat.collapsed .tool-cat-body { display:none; }
  .tool-cat-body { padding: 0 16px 10px; }
  .tool-check {
    display:flex; align-items:center; gap:12px; padding:12px 0;
    border-top:1px solid var(--border); min-height:48px; cursor:pointer;
  }
  .check-box {
    width:24px; height:24px; border-radius:6px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .check-box.checked { background: var(--accent); border-color: var(--accent); }
  .check-box.checked::after { content: '✓'; color:#1a1406; font-weight:700; font-size:14px; }
  .tool-check.checked span { text-decoration: line-through; opacity:0.45; }
  .tool-check span { font-size:15px; font-weight:500; }

  .tabbar {
    position:fixed; left:50%; bottom:0; z-index:180;
    width:100%; max-width: var(--page-w);
    transform: translateX(-50%);
    display:grid; grid-template-columns: 1fr 1fr 1fr;
    padding: 4px 8px var(--safe-bottom);
    min-height: calc(var(--tabbar-h) + var(--safe-bottom));
    background: var(--tabbar-bg);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
  }
  .tabbar-btn {
    min-height:48px; border:none; background:transparent;
    color: var(--text-dim); font: inherit; font-weight:500; font-size:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .tabbar-btn.active { color: var(--text); font-weight:600; }

  .modal-overlay {
    position:fixed; inset:0; background: var(--overlay);
    z-index:300;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.active { display:flex; }
  .modal {
    background: var(--surface); width:100%; max-width:500px;
    border-radius: 14px 14px 0 0;
    padding: 20px 20px calc(16px + var(--safe-bottom));
    max-height: 92vh; overflow-y:auto;
    animation: slideUp 0.24s ease;
  }
  @keyframes slideUp { from { transform:translateY(100%);} to { transform:translateY(0);} }
  .modal-title { font-size:20px; font-weight:600; letter-spacing:-0.02em; margin-bottom:16px; }
  .form-group { margin-bottom:14px; }
  .form-label { display:block; font-size:12px; font-weight:500; color:var(--text-dim); margin-bottom:6px; }
  .form-input, .form-select, .form-textarea {
    width:100%; padding:13px 14px; border-radius:10px; min-height:48px;
    background: var(--surface-2); border:1px solid var(--border);
    color: var(--text); font-size:16px; font-family:inherit; font-weight:500;
    outline:none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { min-height:88px; resize:vertical; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .choice-chip {
    min-height:40px; padding: 8px 12px; border-radius: 8px;
    border:1px solid var(--border); background: transparent;
    color: var(--text); font: inherit; font-size:14px; font-weight:500; cursor:pointer;
  }
  .choice-chip.active { background: var(--accent); color:#1a1406; border-color: var(--accent); }
  .more-toggle {
    width:100%; min-height:44px; margin: 4px 0 12px;
    background: transparent; border:1px solid var(--border); border-radius:10px;
    color: var(--text); font: inherit; font-size:14px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .more-toggle::after {
    content: '›'; font-size:20px; line-height:1; color: var(--text-dim);
    transform: rotate(90deg); transition: transform 0.15s;
  }
  .more-toggle.open::after { transform: rotate(-90deg); }
  .more-toggle:active { background: var(--surface-2); }
  .form-more { display:none; }
  .form-more.open { display:block; padding-bottom: 8px; }
  .check-row {
    display:flex; align-items:center; gap:12px; min-height:48px;
    padding: 8px 0; cursor:pointer; font-weight:500;
  }
  .check-row input { width:22px; height:22px; accent-color: var(--accent); }
  .modal-actions {
    display:flex; gap:10px; margin-top:8px; position:sticky; bottom:0;
    background: var(--surface); padding-top:12px;
  }
  .modal-actions .btn { padding:14px; }
  .confirm-overlay { z-index: 360; }
  .confirm-copy {
    font-size:15px; font-weight:500; color: var(--text-dim);
    line-height:1.45; margin: -6px 0 8px;
  }
  .hint { text-align:center; font-size:13px; color: var(--text-dim); padding: 16px 8px; }
  .empty-state { padding: 36px 8px 12px; color: var(--text-dim); }
  .empty-state p { font-size:15px; font-weight:500; }
  .toast {
    position:fixed; top: calc(56px + var(--safe-top)); left:50%;
    transform:translateX(-50%) translateY(-160px);
    background: var(--surface); border:1px solid var(--border);
    padding:12px 20px; border-radius:10px; font-weight:500; z-index:400;
    transition: transform 0.25s ease;
    pointer-events: none;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .archive-day {
    font-size:12px; font-weight:500; color: var(--text-dim);
    margin: 16px 0 8px;
  }
  .archive-day:first-child { margin-top: 0; }

  .sync-pill {
    font-size:12px; font-weight:500;
    padding: 0 8px; min-height:32px;
    display:flex; align-items:center;
    background: none; color: var(--text-dim); border: none;
  }
  .sync-pill.live { color: var(--success); }
  .sync-pill.err { color: var(--urgent); }
  .settings-block { margin-top: 16px; }
  .settings-block .form-label { margin-top: 10px; }
  .sync-status-line { font-size:13px; font-weight:500; color: var(--text-dim); margin: 0 0 12px; }
  .sync-status-line.live { color: var(--success); }
  .sync-status-line.err { color: var(--urgent); }
  .settings-row {
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    min-height:52px; padding: 12px 0;
  }
  .settings-label { font-size:16px; font-weight:600; }
  .toggle {
    appearance: none; -webkit-appearance: none;
    width: 52px; height: 32px; border-radius: 999px;
    background: var(--border); border: none; cursor: pointer;
    position: relative; flex-shrink: 0;
  }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 26px; height: 26px; border-radius: 50%;
    background: #fff;
    transition: transform 0.15s ease;
  }
  .toggle:checked { background: var(--accent); }
  .toggle:checked::after { transform: translateX(20px); }
  .archive-card { padding: 14px 16px 10px; }
  .archive-card .card-identity { font-size:16px; }
  .archive-meta { margin-top:6px; font-size:13px; color: var(--text-dim); font-weight:500; }
  .archive-actions { display:flex; gap:8px; margin-top:10px; }

  body.selecting-jobs .card { cursor: pointer; }
  body.selecting-jobs .card-top { align-items: center; }
  body.selecting-jobs .card-identity { flex: 1; min-width: 0; }
  body.selecting-jobs .card-links,
  body.selecting-jobs .card-actions,
  body.selecting-jobs .card-details,
  body.selecting-jobs .details-toggle { display: none !important; }
  .card.selected { border-color: var(--accent); }
  .card-top .check-box { margin-top: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo"><img src="shopflow-icon.png" alt="">ShopFlow</div>
    <div class="header-right">
      <div class="sync-pill" id="syncPill" hidden>On phone</div>
      <button class="text-btn" id="newJobBtn" type="button" onclick="openModal()">+ Job</button>
      <button class="text-btn text-btn-ghost" id="selectCancelBtn" type="button" hidden onclick="exitSelectJobs()">Cancel</button>
      <button class="text-btn text-btn-danger" id="selectDeleteBtn" type="button" hidden disabled onclick="deleteSelectedJobs()">Delete</button>
      <button class="icon-btn" id="moreBtn" type="button" onclick="toggleHeaderMenu(event)" title="More" aria-label="More">⋯</button>
      <div class="header-menu" id="headerMenu">
        <button type="button" onclick="startSelectJobs()">Select job</button>
        <button type="button" onclick="openSettings()">Settings</button>
        <button type="button" onclick="shareBoard()">Share today's board</button>
      </div>
    </div>
  </div>
</div>

<div class="section active" id="jobsSection">
  <div id="jobsList"></div>
</div>

<div class="section" id="toolsSection">
  <div id="toolsList"></div>
</div>

<div class="section" id="archiveSection">
  <div id="archiveList"></div>
  <div class="hint">Completed jobs stay on the shared board until you delete them.</div>
</div>

<nav class="tabbar" aria-label="Main">
  <button type="button" class="tabbar-btn active" data-tab="jobs" onclick="switchTab('jobs')">Jobs</button>
  <button type="button" class="tabbar-btn" data-tab="tools" onclick="switchTab('tools')">Tools</button>
  <button type="button" class="tabbar-btn" data-tab="archive" onclick="switchTab('archive')">Done</button>
</nav>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle">New Job</div>
    <form id="jobForm" onsubmit="saveJob(event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="custName">Customer</label>
          <input type="text" class="form-input" id="custName" placeholder="Mike Johnson" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="custPhone">Phone</label>
          <input type="tel" class="form-input" id="custPhone" placeholder="(555) 000-0000" autocomplete="tel">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="custVehicle">Vehicle</label>
        <input type="text" class="form-input" id="custVehicle" placeholder="2015 Mustang" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="jobDesc">What's the job</label>
        <textarea class="form-textarea" id="jobDesc" placeholder="Brake pads, noise diag, oil change..." required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="jobAddress">Address</label>
        <input type="text" class="form-input" id="jobAddress" placeholder="123 Main St" autocomplete="street-address">
      </div>
      <div class="form-group">
        <label class="form-label">When</label>
        <div class="chip-row" id="whenChips">
          <button type="button" class="choice-chip" data-when="now" onclick="setWhenChip('now')">Now</button>
          <button type="button" class="choice-chip" data-when="later" onclick="setWhenChip('later')">Later today</button>
          <button type="button" class="choice-chip" data-when="tomorrow" onclick="setWhenChip('tomorrow')">Tomorrow</button>
          <button type="button" class="choice-chip" data-when="pick" onclick="setWhenChip('pick')">Pick time</button>
        </div>
        <input type="datetime-local" class="form-input" id="jobWhen" hidden style="margin-top:8px">
      </div>
      <div class="form-group">
        <label class="form-label">Who's going</label>
        <div class="chip-row" id="whoChips">
          <button type="button" class="choice-chip" data-who="antonio" onclick="setFormWho('antonio')">Antonio</button>
          <button type="button" class="choice-chip" data-who="anthony" onclick="setFormWho('anthony')">Anthony</button>
        </div>
      </div>
      <button type="button" class="more-toggle" id="moreToggle" onclick="toggleFormMore()">More — urgent, tools, notes</button>
      <div class="form-more" id="formMore">
        <label class="check-row"><input type="checkbox" id="jobUrgent"> Mark urgent</label>
        <div class="form-group">
          <label class="form-label" for="jobTools">Tools / parts</label>
          <input type="text" class="form-input" id="jobTools" placeholder="Torque wrench, pads, scanner...">
        </div>
        <div class="form-group">
          <label class="form-label" for="jobNotes">Notes</label>
          <textarea class="form-textarea" id="jobNotes" placeholder="Park in driveway, dog in yard..."></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Job</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-title">Settings</div>
    <div class="settings-row">
      <span class="settings-label">Light mode</span>
      <input class="toggle" type="checkbox" id="lightModeToggle" onchange="setLightMode(this.checked)" aria-label="Light mode">
    </div>
    <div class="settings-block">
      <div class="settings-label" style="margin-bottom:8px;margin-top:8px">Share with partner</div>
      <p class="sync-status-line" id="syncStatusLine">On this phone only</p>

// Ids waiting to reach the cloud. Persisted, so edits made with no signal

const dirty = { jobs: new Set(), archive: new Set(), full: false };

function init() {

// Sync follows the sign-in state. Firebase restores the session from storage,
// so a returning phone reconnects on its own with nothing typed.
function watchAuth() {
  if (!firebaseReady()) {
    setSyncStatus('off');
    return;
  }
  try {
    firebaseApp();
    firebase.auth().onAuthStateChanged(user => {
      if (user) startSync();
      else {
        stopSync();
        setSyncStatus('off');
      }
    });
  } catch (err) {
    setSyncStatus('error', err.message || String(err));
  }
}

function migrate(parsed) {
  const jobs = Array.isArray(parsed.jobs) ? parsed.jobs : [];
  const archive = Array.isArray(parsed.archive) ? parsed.archive : [];

  const activeJobs = jobs
    .filter(j => !j.archived)
    .map(normalizeJob);

  const archiveJobs = archive.map(normalizeJob);

  const useTruckTools = !parsed.version || parsed.version < 14 || !Array.isArray(parsed.toolCategories);
  data = {
    version: 14,
    jobs: activeJobs,
    archive: archiveJobs,
    toolCategories: useTruckTools ? TRUCK_TOOLS : parsed.toolCategories,
    toolState: useTruckTools ? {} : (parsed.toolState || {}),
    theme: parsed.theme === 'light' ? 'light' : 'dark'
  };
  // Normalizing legacy local data is not a board edit; it reaches the cloud
  // with the next real change.
  saveData({ cloud: false });
}

function newJobId() {
  return 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function normalizeJob(job) {
  const status = ['queued', 'onsite', 'waiting'].includes(job.status) ? job.status : 'queued';
  let assignedTo = job.assignedTo || '';
  if (assignedTo && !TECHS.some(t => t.id === assignedTo)) {
    const old = String(assignedTo);
    if (old === 'm1') assignedTo = 'antonio';
    else if (old === 'm2') assignedTo = 'anthony';
    else assignedTo = '';
  }
  return {
    id: job.id || newJobId(),
    customer: job.customer || '',
    phone: job.phone || '',
    vehicle: job.vehicle || '',
    address: job.address || '',
    when: job.when || '',
    desc: job.desc || '',
    priority: ['urgent', 'warning', 'normal'].includes(job.priority) ? job.priority : 'normal',
    assignedTo,
    status,
    tools: job.tools || '',
    notes: job.notes || '',
    createdAt: job.createdAt || Date.now(),
    completedAt: job.completedAt || null
  };
}

function persistLocal() {
  localStorage.setItem('shopflow_data', JSON.stringify(data));
}

// opts.jobs / opts.archive name the ids that changed so the cloud write only
// touches those paths and leaves the other phone's edits alone. Passing
// neither forces a whole-board write.
function saveData(opts) {
  persistLocal();
  if (opts && opts.cloud === false) return;
  if (opts && (opts.jobs || opts.archive)) {
    idList(opts.jobs).forEach(id => dirty.jobs.add(id));
    idList(opts.archive).forEach(id => dirty.archive.add(id));
  } else {
    dirty.full = true;
  }
  persistDirty();
  scheduleCloudPush();
}

function idList(v) {
  if (!v) return [];
  return Array.isArray(v) ? v.filter(Boolean) : [v];
}

function hasDirty() {
  return dirty.full || dirty.jobs.size > 0 || dirty.archive.size > 0;
}

function persistDirty() {
  const prefs = readSyncPrefs();
  // Only worth persisting once this phone is actually on the shared board.
  if (prefs.joinedBoard !== BOARD_ID) return;
  prefs.pending = {
    jobs: Array.from(dirty.jobs),
    archive: Array.from(dirty.archive),
    full: dirty.full
  };
  writeSyncPrefs(prefs);
}

function loadDirty() {
  const pending = readSyncPrefs().pending || {};
  dirty.jobs = new Set(Array.isArray(pending.jobs) ? pending.jobs : []);
  dirty.archive = new Set(Array.isArray(pending.archive) ? pending.archive : []);
  dirty.full = !!pending.full;
}

function takeDirty() {
  const batch = {
    jobs: Array.from(dirty.jobs),
    archive: Array.from(dirty.archive),
    full: dirty.full
  };
  dirty.jobs.clear();
  dirty.archive.clear();
  dirty.full = false;
  persistDirty();
  return batch;
}

function restoreDirty(batch) {
  batch.jobs.forEach(id => dirty.jobs.add(id));
  batch.archive.forEach(id => dirty.archive.add(id));
  if (batch.full) dirty.full = true;
  persistDirty();
}

function readSyncPrefs() {
  try {
    return JSON.parse(localStorage.getItem(SYNC_LS) || '{}') || {};
  } catch (e) {
    return {};
  }
}

function writeSyncPrefs(prefs) {
  localStorage.setItem(SYNC_LS, JSON.stringify(prefs));
}

function firebaseReady() {
  return typeof firebase !== 'undefined' && firebase.auth && firebase.database;
}

// One app instance, created lazily so a failed CDN load can't break startup.
function firebaseApp() {
  if (!firebaseReady()) return null;
  if (!firebase.apps.length) return firebase.initializeApp(FIREBASE_CONFIG);
  return firebase.app();
}

function currentUser() {
  if (!firebaseReady()) return null;
  try {
    return firebase.auth().currentUser;
  } catch (e) {
    return null;
  }
}

function asJobArray(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v.filter(Boolean);
  return Object.keys(v).map(k => v[k]).filter(Boolean);
}

function jobForCloud(job) {
  return {
    id: job.id || '',
    customer: job.customer || '',
    phone: job.phone || '',
    vehicle: job.vehicle || '',
    address: job.address || '',
    when: job.when || '',
    desc: job.desc || '',
    priority: job.priority || 'normal',
    assignedTo: job.assignedTo || '',
    status: job.status || 'queued',
    tools: job.tools || '',
    notes: job.notes || '',
    createdAt: job.createdAt || Date.now(),
    completedAt: job.completedAt || null
  };
}

function cloudPayload() {
  const jobs = {};
  data.jobs.forEach(j => { jobs[j.id] = jobForCloud(j); });
  const archive = {};
  data.archive.forEach(j => { archive[j.id] = jobForCloud(j); });
  return {
    version: data.version,
    jobs,
    archive,
    updatedAt: Date.now()
  };
}

function unionById(primary, extra) {
  const map = new Map();
  primary.forEach(j => map.set(j.id, j));
  extra.forEach(j => { if (!map.has(j.id)) map.set(j.id, j); });
  return Array.from(map.values());
}

function applyCloud(remote) {
  const safe = remote && typeof remote === 'object' ? remote : {};
  const jobs = overlayPending(asJobArray(safe.jobs).map(normalizeJob), data.jobs, dirty.jobs);
  const archive = overlayPending(asJobArray(safe.archive).map(normalizeJob), data.archive, dirty.archive);
  const archiveIds = new Set(archive.map(j => j.id));
  data.jobs = jobs.filter(j => !archiveIds.has(j.id));
  data.archive = archive;
}

// A snapshot was built before our queued writes landed, so for those ids the
// local copy is the newer one. An id queued but no longer held locally was
// deleted or moved here, and must not come back.
function overlayPending(remoteList, localList, pendingIds) {
  const map = new Map();
  remoteList.forEach(j => map.set(j.id, j));
  pendingIds.forEach(id => {
    const local = localList.find(j => j.id === id);
    if (local) map.set(id, local);
    else map.delete(id);
  });
  return Array.from(map.values());
}

function setSyncStatus(status, error) {
  sync.status = status;
  sync.error = error || '';
  updateSyncUi();
}

function updateSyncUi() {
  const pill = document.getElementById('syncPill');
  const line = document.getElementById('syncStatusLine');
  const user = currentUser();

  let label = user ? 'Signed in — connecting…' : 'On this phone only';
  let pillText = '';
  let pillClass = 'sync-pill';
  let lineClass = 'sync-status-line';
  if (sync.status === 'connecting') {
    label = 'Connecting…';
    pillText = 'Syncing';
  } else if (sync.status === 'live') {
    label = 'Live — jobs show on both phones';
    pillText = 'Live';
    pillClass += ' live';
    lineClass += ' live';
  } else if (sync.status === 'error') {
    label = 'Sync error: ' + (sync.error || 'check the Firebase rules');
    pillText = 'Sync off';
    pillClass += ' err';
    lineClass += ' err';
  } else if (user && hasDirty()) {
    // Signed in but not connected: edits are safe and waiting.
    label = 'Waiting for signal — changes will sync';
    pillText = 'Queued';
  }
  if (line) {
    line.className = lineClass;
    line.textContent = label;
  }
  if (pill) {
    pill.className = pillClass;
    pill.textContent = pillText;
    pill.hidden = !pillText;
  }
  updateAuthUi();
}

function updateAuthUi() {
  const user = currentUser();
  const signedOut = document.getElementById('signedOutWrap');
  const signedIn = document.getElementById('signedInWrap');
  const who = document.getElementById('signedInAs');
  if (signedOut) signedOut.hidden = !!user;
  if (signedIn) signedIn.hidden = !user;
  if (who && user) who.textContent = user.email || 'signed in';
}

function scheduleCloudPush() {
  if (sync.applying || !sync.ref) return;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushCloud, 250);
}

function pushCloud() {
  if (sync.applying || !sync.ref || !hasDirty()) return;
  const ref = sync.ref;
  const batch = takeDirty();
  // A rejected write keeps its ids queued so the next push carries them.
  const fail = err => {
    restoreDirty(batch);
    setSyncStatus('error', err.message || String(err));
  };
  if (batch.full) {
    ref.set(cloudPayload()).catch(fail);
    return;
  }
  const updates = { updatedAt: Date.now() };
  batch.jobs.forEach(id => {
    const job = data.jobs.find(j => j.id === id);
    updates['jobs/' + id] = job ? jobForCloud(job) : null;
  });
  batch.archive.forEach(id => {
    const job = data.archive.find(j => j.id === id);
    updates['archive/' + id] = job ? jobForCloud(job) : null;
  });
  ref.update(updates).catch(fail);
}

function pushFull() {
  dirty.full = true;
  persistDirty();
  pushCloud();
}

function stopSync() {
  clearTimeout(sync.timer);
  if (sync.ref) {
    try { sync.ref.off(); } catch (e) {}
  }
  if (sync.connRef) {
    try { sync.connRef.off(); } catch (e) {}
  }
  sync.ref = null;
  sync.connRef = null;
  sync.seenFirst = false;
}

function startSync() {
  stopSync();
  loadDirty();
  if (!currentUser()) {
    setSyncStatus('off');
    return;
  }
  if (!firebaseReady()) {
    setSyncStatus('error', 'Firebase failed to load (need internet)');
    return;
  }
  setSyncStatus('connecting');
  try {
    sync.app = firebaseApp();
    const db = firebase.database();
    sync.seenFirst = false;
    sync.ref = db.ref('boards/' + BOARD_ID);
    sync.connRef = db.ref('.info/connected');
    sync.connRef.on('value', snap => {
      if (!sync.ref) return;
      if (snap.val() === true && sync.status !== 'error') setSyncStatus(sync.seenFirst ? 'live' : 'connecting');
    });
    sync.ref.on('value', snap => {
      const remote = snap.val();
      if (!sync.seenFirst) {
        sync.seenFirst = true;
        handleFirstSnap(remote);
        return;
      }
      // Our own writes always leave updatedAt behind, so a missing node means
      // the board was deleted out from under us. Reseed it, don't mirror it.
      if (!remote) {
        pushFull();
        return;
      }
      if (dirty.full) {
        pushCloud();
        return;
      }
      sync.applying = true;
      applyCloud(remote);
      persistLocal();
      sync.applying = false;
      renderAll();
      if (hasDirty()) scheduleCloudPush();
    }, err => {
      setSyncStatus('error', err.message || String(err));
    });
  } catch (err) {
    setSyncStatus('error', err.message || String(err));
  }
}

function handleFirstSnap(remote) {
  const prefs = readSyncPrefs();
  const joined = prefs.joinedBoard === BOARD_ID;
  if (!remote) {
    writeSyncPrefs(Object.assign({}, prefs, { joinedBoard: BOARD_ID }));
    pushFull();
    setSyncStatus('live');
    return;
  }
  if (!joined) {
    // Joining a board for the first time: fold whatever this phone already
    // had into the shared list rather than picking a winner.
    const remoteJobs = asJobArray(remote.jobs).map(normalizeJob);
    const remoteArch = asJobArray(remote.archive).map(normalizeJob);
    data.jobs = unionById(remoteJobs, data.jobs.map(normalizeJob));
    data.archive = unionById(remoteArch, data.archive.map(normalizeJob));
    const archIds = new Set(data.archive.map(j => j.id));
    data.jobs = data.jobs.filter(j => !archIds.has(j.id));
    persistLocal();
    renderAll();
    writeSyncPrefs(Object.assign({}, readSyncPrefs(), { joinedBoard: BOARD_ID }));
    pushFull();
  } else {
    sync.applying = true;
    applyCloud(remote);
    persistLocal();
    sync.applying = false;
    renderAll();
    // Anything queued from an offline session goes out now.
    if (hasDirty()) scheduleCloudPush();
  }
  setSyncStatus('live');
}

// Sign-in only, never sign-up: the accounts are created once in the Firebase
// console so a stranger can't register themselves onto the board.
async function signIn() {
  const emailEl = document.getElementById('authEmail');
  const passEl = document.getElementById('authPassword');
  const email = (emailEl.value || '').trim();
  const password = passEl.value || '';
  if (!email || !password) {
    showToast('Enter your email and password');
    return;
  }
  if (!firebaseReady()) {
    showToast('No connection — try again with signal');
    return;
  }
  try {
    firebaseApp();
    showToast('Signing in…');
    await firebase.auth().signInWithEmailAndPassword(email, password);
    passEl.value = '';
    showToast('Signed in');
  } catch (err) {
    showToast(signInError(err));
  }
}

function signInError(err) {
  const code = (err && err.code) || '';
  if (code === 'auth/invalid-email') return 'That email looks wrong';
  if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'Wrong email or password';
  if (code === 'auth/user-not-found') return 'No account for that email';
  if (code === 'auth/too-many-requests') return 'Too many tries — wait a minute';
  if (code === 'auth/network-request-failed') return 'No connection — try again with signal';
  return (err && err.message) || 'Could not sign in';
}

async function signOutShop() {
  stopSync();
  const prefs = readSyncPrefs();
  // Keep the pending queue: those edits still belong to this board.
  writeSyncPrefs({ joinedBoard: prefs.joinedBoard, pending: prefs.pending });
  try {
    if (firebaseReady()) await firebase.auth().signOut();
  } catch (e) {}
  setSyncStatus('off');
  showToast('Signed out — this phone only');
}

async function resetPassword() {
  const email = (document.getElementById('authEmail').value || '').trim();
  if (!email) {
    showToast('Enter your email first');
    return;
  }
  if (!firebaseReady()) {
    showToast('No connection — try again with signal');
    return;
  }
  try {
    firebaseApp();
    await firebase.auth().sendPasswordResetEmail(email);
    showToast('Reset email sent');
  } catch (err) {
    showToast(signInError(err));
  }
}

function switchTab(tab) {
  if (selectingJobs && tab !== 'jobs') exitSelectJobs();
  currentTab = tab;
  document.querySelectorAll('.tabbar-btn').forEach(p => p.classList.toggle('active', p.dataset.tab === tab));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === tab + 'Section'));
  closeHeaderMenu();
  updateSelectChrome();
}

function toggleHeaderMenu(e) {
  e.stopPropagation();
  document.getElementById('headerMenu').classList.toggle('open');
}

function closeHeaderMenu() {
  document.getElementById('headerMenu')?.classList.remove('open');
}

function updateSelectChrome() {
  const on = selectingJobs;
  document.body.classList.toggle('selecting-jobs', on);
  const newJobBtn = document.getElementById('newJobBtn');
  const moreBtn = document.getElementById('moreBtn');
  const cancelBtn = document.getElementById('selectCancelBtn');
  const deleteBtn = document.getElementById('selectDeleteBtn');
  if (newJobBtn) newJobBtn.hidden = on || currentTab !== 'jobs';
  if (moreBtn) moreBtn.hidden = on;
  if (cancelBtn) cancelBtn.hidden = !on;
  if (deleteBtn) {
    deleteBtn.hidden = !on;
    deleteBtn.disabled = selectedJobIds.size === 0;
  }
}

function startSelectJobs() {
  closeHeaderMenu();
  if (!data.jobs.length) {
    showToast('No jobs to select');
    return;
  }
  if (currentTab !== 'jobs') {
    currentTab = 'jobs';
    document.querySelectorAll('.tabbar-btn').forEach(p => p.classList.toggle('active', p.dataset.tab === 'jobs'));
    document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'jobsSection'));
  }
  selectingJobs = true;
  selectedJobIds.clear();
  updateSelectChrome();
  renderJobs();
}

function exitSelectJobs() {
  if (!selectingJobs) return;
  selectingJobs = false;
  selectedJobIds.clear();
  updateSelectChrome();
  renderJobs();
}

function toggleJobSelected(id) {
  if (selectedJobIds.has(id)) selectedJobIds.delete(id);
  else selectedJobIds.add(id);
  const card = document.querySelector('#jobsList .card[data-id="' + CSS.escape(id) + '"]');
  if (card) {
    const on = selectedJobIds.has(id);
    card.classList.toggle('selected', on);
    card.querySelector('.check-box')?.classList.toggle('checked', on);
  }
  updateSelectChrome();
}

function deleteSelectedJobs() {
  const ids = Array.from(selectedJobIds);
  if (!ids.length) return;
  const n = ids.length;
  askConfirm({
    title: n === 1 ? 'Delete this job?' : 'Delete ' + n + ' jobs?',
    body: "Can't undo this.",
    ok: n === 1 ? 'Delete' : 'Delete ' + n,
    danger: true
  }).then(ok => {
    if (!ok) return;
    const idSet = new Set(ids);
    data.jobs = data.jobs.filter(j => !idSet.has(j.id));
    ids.forEach(id => expandedIds.delete(id));
    selectingJobs = false;
    selectedJobIds.clear();
    saveData({ jobs: ids });
    updateSelectChrome();
    renderAll();
    showToast(n === 1 ? 'Deleted' : n + ' jobs deleted');
  });
}

function applyTheme(theme) {
  const light = theme === 'light';
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', light ? '#f3efe6' : '#12110f');
  const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (bar) bar.setAttribute('content', light ? 'default' : 'black-translucent');
  const toggle = document.getElementById('lightModeToggle');
  if (toggle) toggle.checked = light;
}

function setLightMode(on) {
  data.theme = on ? 'light' : 'dark';
  applyTheme(data.theme);
  saveData({ cloud: false });
}

function openSettings() {
  closeHeaderMenu();
  applyTheme(data.theme);
  updateSyncUi();
  document.getElementById('settingsOverlay').classList.add('active');
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('active');
}

let confirmResolver = null;

function askConfirm({ title, body, ok, danger }) {
  if (confirmResolver) confirmResolver(false);
  document.getElementById('confirmTitle').textContent = title;
  const copy = document.getElementById('confirmBody');
  copy.textContent = body || '';
  copy.hidden = !body;
  const okBtn = document.getElementById('confirmOk');
  okBtn.textContent = ok || 'OK';
  okBtn.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
  document.getElementById('confirmOverlay').classList.add('active');
  document.getElementById('confirmCancel').focus();
  return new Promise(resolve => { confirmResolver = resolve; });
}

function closeConfirm(ok) {
  document.getElementById('confirmOverlay').classList.remove('active');
  const resolve = confirmResolver;
  confirmResolver = null;
  if (resolve) resolve(!!ok);
}

function techName(id) {
  return TECHS.find(t => t.id === id)?.name || '';
}

function toLocalInput(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatWhen(when) {
  if (!when) return '';
  const d = new Date(when);
  if (Number.isNaN(d.getTime())) return when;
  const time = d.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit' });
  const now = new Date();
  const today = now.toDateString();
  const tom = new Date(now);
  tom.setDate(tom.getDate() + 1);
  if (d.toDateString() === today) return 'Today ' + time;
  if (d.toDateString() === tom.toDateString()) return 'Tomorrow ' + time;
  return d.toLocaleString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function isOverdue(job) {
  if (!job.when || job.status === 'onsite') return false;
  const d = new Date(job.when);
  return !Number.isNaN(d.getTime()) && d.getTime() < Date.now() - 45 * 60 * 1000;
}

function mapsUrl(address) {
  return 'https://maps.apple.com/?q=' + encodeURIComponent(address);
}

function phoneDigits(phone) {
  return String(phone).replace(/[^\d+]/g, '');
}

function telHref(phone) {
  return 'tel:' + phoneDigits(phone);
}

function imessageHref(phone) {
  const n = encodeURIComponent(phoneDigits(phone));
  // iOS: sms:NUMBER alone often just launches Messages. NUMBER&body=
  // opens a compose to that recipient (empty body so they type it).
  return 'sms:' + n + '&body=';
}

function sortJobs(jobs) {
  const priorityOrder = { urgent: 0, warning: 1, normal: 2 };
  return jobs.slice().sort((a, b) => {
    const pa = (priorityOrder[a.priority] ?? 2) - (priorityOrder[b.priority] ?? 2);
    if (pa !== 0) return pa;
    const wa = a.when ? new Date(a.when).getTime() : Infinity;
    const wb = b.when ? new Date(b.when).getTime() : Infinity;
    return wa - wb;
  });
}

function renderJobs() {
  const list = document.getElementById('jobsList');

  if (!data.jobs.length) {
    if (selectingJobs) {
      selectingJobs = false;
      selectedJobIds.clear();
      updateSelectChrome();
    }
    list.innerHTML = `
      <div class="empty-state">
        <p>Nothing on the board. Tap + Job.</p>
      </div>`;
    return;
  }

  const groups = [
    { key: 'onsite', title: 'On site', jobs: sortJobs(data.jobs.filter(j => j.status === 'onsite')) },
    { key: 'waiting', title: 'Waiting parts', jobs: sortJobs(data.jobs.filter(j => j.status === 'waiting')) },
    { key: 'queued', title: 'Up next', jobs: sortJobs(data.jobs.filter(j => j.status === 'queued')) }
  ];

  list.innerHTML = groups.map(g => {
    if (!g.jobs.length) return '';
    return `<div class="job-group">
      <div class="group-title"><span class="dot dot-${g.key}"></span>${g.title} <span class="n">${g.jobs.length}</span></div>
      ${g.jobs.map(jobCardHtml).join('')}
    </div>`;
  }).join('');
}

function jobCardHtml(job) {
  const who = techName(job.assignedTo);
  const tools = job.tools ? job.tools.split(',').map(t => t.trim()).filter(Boolean) : [];
  const identity = [job.customer, job.vehicle].filter(Boolean).join(' · ');
  const expanded = expandedIds.has(job.id);
  const overdue = isOverdue(job);
  let primary;
  if (job.status === 'queued') {
    primary = `<button class="btn btn-primary" type="button" data-act="onsite">On site</button>`;
  } else if (job.status === 'onsite') {
    primary = `<button class="btn btn-primary" type="button" data-act="done">Done</button>`;
  } else {
    primary = `<button class="btn btn-primary" type="button" data-act="queued">Back on it</button>`;
  }

  const call = job.phone
    ? `<a href="${telHref(job.phone)}">Call</a>`
    : '';
  const text = job.phone
    ? `<a href="${esc(imessageHref(job.phone))}" data-act="imessage">Text</a>`
    : '';
  const maps = job.address
    ? `<a href="${mapsUrl(job.address)}" target="_blank" rel="noopener">Maps</a>`
    : '';

  const waitBtn = job.status !== 'waiting'
    ? `<button class="btn btn-ghost" type="button" data-act="waiting">Waiting parts</button>`
    : '';
  const doneInDetails = job.status !== 'onsite'
    ? `<button class="btn btn-ghost" type="button" data-act="done">Done</button>`
    : '';

  const selected = selectingJobs && selectedJobIds.has(job.id);

  return `
    <div class="card${expanded ? ' expanded' : ''}${selected ? ' selected' : ''}" data-id="${esc(job.id)}">
      <div class="card-top">
        ${selectingJobs ? `<span class="check-box${selected ? ' checked' : ''}"></span>` : ''}
        <div class="card-identity">${esc(identity || 'Job')}</div>
        ${who ? `<span class="who">${esc(who)}</span>` : ''}
      </div>
      ${job.when ? `<div class="card-when${overdue ? ' overdue' : ''}">${esc(formatWhen(job.when))}</div>` : ''}
      ${job.address ? `<div class="card-where">${esc(job.address)}</div>` : ''}
      <div class="card-job">${esc(job.desc)}</div>
      ${job.priority === 'urgent' ? '<div class="urgent-mark">Urgent</div>' : ''}
      ${(call || text || maps) ? `<div class="card-links">${call}${text}${maps}</div>` : ''}
      <div class="card-actions">${primary}</div>
      <div class="card-details">
        ${job.notes ? `<div class="card-notes">${esc(job.notes)}</div>` : ''}
        ${tools.length ? `<div class="card-tools">${tools.map(t => `<span class="tool-tag">${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="details-actions">
          ${waitBtn}
          ${doneInDetails}
          <button class="btn btn-ghost" type="button" data-act="edit">Edit</button>
        </div>
      </div>
      <button class="details-toggle" type="button" data-act="expand">${expanded ? 'Hide details' : 'Details'}</button>
    </div>`;
}

function onJobsClick(e) {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  if (selectingJobs) {
    e.preventDefault();
    toggleJobSelected(id);
    return;
  }
  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;
  if (act === 'onsite') setJobStatus(id, 'onsite');
  else if (act === 'waiting') setJobStatus(id, 'waiting');
  else if (act === 'queued') setJobStatus(id, 'queued');
  else if (act === 'done') archiveJob(id);
  else if (act === 'edit') editJob(id);
  else if (act === 'expand') toggleExpand(id);
  else if (act === 'imessage') {
    e.preventDefault();
    const href = actEl.getAttribute('href');
    if (href) window.location.href = href;
  }
}

function toggleExpand(id) {
  if (expandedIds.has(id)) expandedIds.delete(id);
  else expandedIds.add(id);
  const card = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
  if (!card) return;
  const open = expandedIds.has(id);
  card.classList.toggle('expanded', open);
  const toggle = card.querySelector('.details-toggle');
  if (toggle) toggle.textContent = open ? 'Hide details' : 'Details';
}

function setJobStatus(id, status) {
  const job = data.jobs.find(j => j.id === id);
  if (!job) return;
  job.status = status;
  saveData({ jobs: id });
  renderJobs();
  showToast((job.customer || 'Job') + ': ' + (STATUS_LABELS[status] || status));
}

function renderArchive() {
  const list = document.getElementById('archiveList');

  if (!data.archive.length) {
    list.innerHTML = `
      <div class="empty-state">
        <p>No completed jobs yet.</p>
      </div>`;
    return;
  }

  const groups = [];
  const sorted = data.archive.slice().sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
  sorted.forEach(job => {
    const label = job.completedAt
      ? new Date(job.completedAt).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
      : 'Recently';
    const last = groups[groups.length - 1];
    if (!last || last.label !== label) groups.push({ label, jobs: [job] });
    else last.jobs.push(job);
  });

  list.innerHTML = groups.map(g => {
    return `<div class="archive-day">${esc(g.label)}</div>` + g.jobs.map(job => {
      const who = techName(job.assignedTo);
      const identity = [job.customer, job.vehicle].filter(Boolean).join(' · ');
      return `
        <div class="card archive-card" data-id="${esc(job.id)}">
          <div class="card-identity">${esc(identity || job.desc)}</div>
          <div class="card-job" style="margin-top:6px;color:var(--text-dim)">${esc(job.desc)}</div>
          ${who ? `<div class="archive-meta">${esc(who)}</div>` : ''}
          <div class="archive-actions">
            <button class="btn btn-ghost btn-sm" type="button" data-act="restore">Restore</button>
            <button class="btn btn-danger btn-sm" type="button" data-act="delete">Delete</button>
          </div>
        </div>`;
    }).join('');
  }).join('');
}

function onArchiveClick(e) {
  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const card = actEl.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  if (actEl.dataset.act === 'restore') restoreJob(id);
  else if (actEl.dataset.act === 'delete') deleteJob(id, true);
}

function renderTools() {
  const list = document.getElementById('toolsList');
  const cats = data.toolCategories;

  list.innerHTML = `
    <div class="tools-reset-row">
      <button class="btn btn-ghost btn-sm" type="button" onclick="resetTruckChecklist()">Reset</button>
    </div>` + cats.map((cat, ci) => {
    const checkedCount = cat.tools.filter((_, ti) => data.toolState[`${ci}-${ti}`]).length;
    const isCollapsed = !expandedToolCats.has(ci);
    return `
      <div class="tool-cat ${isCollapsed ? 'collapsed' : ''}" id="toolCat-${ci}">
        <div class="tool-cat-header" onclick="toggleToolCat(${ci})">
          <span>${esc(cat.name)} <span style="color:var(--text-dim);font-weight:500;">${checkedCount}/${cat.tools.length}</span></span>
        </div>
        <div class="tool-cat-body">
          ${cat.tools.map((tool, ti) => {
            const key = `${ci}-${ti}`;
            const on = data.toolState[key] ? 'checked' : '';
            return `
              <div class="tool-check ${on}" onclick="toggleTool('${key}')">
                <div class="check-box ${on}"></div>
                <span>${esc(tool)}</span>
              </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
}

function toggleToolCat(ci) {
  if (expandedToolCats.has(ci)) expandedToolCats.delete(ci);
  else expandedToolCats.add(ci);
  document.getElementById('toolCat-' + ci).classList.toggle('collapsed', !expandedToolCats.has(ci));
}

function toggleTool(key) {
  data.toolState[key] = !data.toolState[key];
  saveData({ cloud: false });
  renderTools();
}

function resetTruckChecklist() {
  askConfirm({
    title: 'Reset tools?',
    body: 'Clears checkmarks for a new day.',
    ok: 'Reset',
    danger: false
  }).then(ok => {
    if (!ok) return;
    data.toolState = {};
    expandedToolCats = new Set();
    saveData({ cloud: false });
    renderTools();
    showToast('Checklist reset');
  });
}

function setWhenChip(kind) {
  document.querySelectorAll('#whenChips .choice-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.when === kind);
  });
  const input = document.getElementById('jobWhen');
  if (kind === 'pick') {
    input.hidden = false;
    if (!input.value) input.value = toLocalInput(new Date());
    input.focus();
    return;
  }
  input.hidden = true;
  const now = new Date();
  let d;
  if (kind === 'now') {
    d = now;
  } else if (kind === 'later') {
    d = new Date(now);
    d.setHours(15, 0, 0, 0);
    if (d.getTime() <= now.getTime()) {
      d = new Date(now.getTime() + 3 * 60 * 60 * 1000);
      d.setMinutes(0, 0, 0);
    }
  } else {
    d = new Date(now);
    d.setDate(d.getDate() + 1);
    d.setHours(9, 0, 0, 0);
  }
  input.value = toLocalInput(d);
}

function setFormWho(who) {
  formWho = formWho === who ? '' : who;
  document.querySelectorAll('#whoChips .choice-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.who === formWho);
  });
}

function toggleFormMore(force) {
  const box = document.getElementById('formMore');
  const open = force === true ? true : force === false ? false : !box.classList.contains('open');
  box.classList.toggle('open', open);
  const toggle = document.getElementById('moreToggle');
  toggle.classList.toggle('open', open);
  toggle.textContent = open ? 'Less details' : 'More — urgent, tools, notes';
}

function openModal(editId = null) {
  editingId = editId;
  document.getElementById('modalTitle').textContent = editId ? 'Edit Job' : 'New Job';
  document.getElementById('modalOverlay').classList.add('active');
  document.getElementById('jobForm').reset();
  formWho = '';
  document.querySelectorAll('#whoChips .choice-chip').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('#whenChips .choice-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('jobWhen').hidden = true;
  toggleFormMore(false);

  if (editId) {
    const job = data.jobs.find(j => j.id === editId);
    if (!job) return;
    document.getElementById('custName').value = job.customer;
    document.getElementById('custPhone').value = job.phone || '';
    document.getElementById('custVehicle').value = job.vehicle || '';
    document.getElementById('jobAddress').value = job.address || '';
    document.getElementById('jobWhen').value = job.when || '';
    document.getElementById('jobDesc').value = job.desc;
    document.getElementById('jobTools').value = job.tools || '';
    document.getElementById('jobNotes').value = job.notes || '';
    document.getElementById('jobUrgent').checked = job.priority === 'urgent';
    formWho = job.assignedTo || '';
    document.querySelectorAll('#whoChips .choice-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.who === formWho);
    });
    if (job.when) {
      document.getElementById('jobWhen').hidden = false;
      document.querySelector('#whenChips [data-when="pick"]')?.classList.add('active');
    }
    if (job.tools || job.notes || job.priority === 'urgent') {
      toggleFormMore(true);
    }
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null;
}

function saveJob(e) {
  e.preventDefault();
  const existing = editingId ? data.jobs.find(j => j.id === editingId) : null;
  let priority = existing?.priority === 'warning' ? 'warning' : 'normal';
  if (document.getElementById('jobUrgent').checked) priority = 'urgent';
  else if (existing?.priority === 'urgent') priority = 'normal';

  const status = existing?.status || 'queued';

  const job = normalizeJob({
    id: editingId || newJobId(),
    customer: document.getElementById('custName').value.trim(),
    phone: document.getElementById('custPhone').value.trim(),
    vehicle: document.getElementById('custVehicle').value.trim(),
    address: document.getElementById('jobAddress').value.trim(),
    when: document.getElementById('jobWhen').value,
    desc: document.getElementById('jobDesc').value.trim(),
    priority,
    assignedTo: formWho,
    status,
    tools: document.getElementById('jobTools').value.trim(),
    notes: document.getElementById('jobNotes').value.trim(),
    createdAt: existing?.createdAt || Date.now()
  });

  if (editingId) {
    const idx = data.jobs.findIndex(j => j.id === editingId);
    if (idx >= 0) data.jobs[idx] = job;
  } else {
    data.jobs.push(job);
  }

  saveData({ jobs: job.id });
  closeModal();
  renderAll();
  showToast(editingId ? 'Job updated' : 'Job added');
}

function editJob(id) {
  openModal(id);
}

function archiveJob(id) {
  const idx = data.jobs.findIndex(j => j.id === id);
  if (idx < 0) return;
  const job = data.jobs[idx];
  job.completedAt = Date.now();
  data.archive.push(job);
  data.jobs.splice(idx, 1);
  expandedIds.delete(id);
  saveData({ jobs: id, archive: id });
  renderAll();
  showToast('Job completed');
}

function restoreJob(id) {
  const idx = data.archive.findIndex(j => j.id === id);
  if (idx < 0) return;
  const job = data.archive[idx];
  delete job.completedAt;
  job.status = 'queued';
  data.jobs.push(job);
  data.archive.splice(idx, 1);
  saveData({ jobs: id, archive: id });
  renderAll();
  switchTab('jobs');
  showToast('Job restored');
}

function deleteJob(id, fromArchive = false) {
  askConfirm({
    title: 'Delete this job?',
    body: "Can't undo this.",
    ok: 'Delete',
    danger: true
  }).then(ok => {
    if (!ok) return;
    if (fromArchive) {
      data.archive = data.archive.filter(j => j.id !== id);
    } else {
      data.jobs = data.jobs.filter(j => j.id !== id);
    }
    saveData(fromArchive ? { archive: id } : { jobs: id });
    renderAll();
    showToast('Deleted');
  });
}

function renderAll() {
  renderJobs();
  renderTools();
  renderArchive();
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function shareBoard() {
  closeHeaderMenu();
  const active = data.jobs;
  const summary = [
    `ShopFlow — ${new Date().toLocaleDateString()}`,
    `Antonio & Anthony`,
    ``,
    `Active jobs: ${active.length}`,
    `Completed: ${data.archive.length}`,
    ``,
    `--- URGENT ---`,
    ...active.filter(j => j.priority === 'urgent').map(formatShareJob),
    ``,
    `--- ON SITE ---`,
    ...active.filter(j => j.status === 'onsite').map(formatShareJob),
    ``,
    `--- WAITING PARTS ---`,
    ...active.filter(j => j.status === 'waiting').map(formatShareJob),
    ``,
    `--- UP NEXT ---`,
    ...active.filter(j => j.status === 'queued').map(formatShareJob)
  ].join('\n');

  if (navigator.share) {
    try {
      await navigator.share({ title: 'ShopFlow Board', text: summary });
    } catch (e) {}
  } else {
    await navigator.clipboard.writeText(summary);
    showToast('Summary copied');
  }
}

function formatShareJob(j) {
  const who = techName(j.assignedTo);
  const bits = [
    j.customer,
    j.desc,
    j.vehicle,
    j.address,
    j.when ? formatWhen(j.when) : '',
    who
  ].filter(Boolean);
  return `• ${bits.join(' — ')}`;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

init();
</script>
