<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>ShopFlow - Mobile Job Board</title>
<style>
  :root {
    --bg: #0b0f19;
    --surface: #151b2b;
    --surface-2: #1e2538;
    --border: #2a324a;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #f59e0b;
    --accent-2: #3b82f6;
    --urgent: #ef4444;
    --warning: #f97316;
    --success: #22c55e;
    --info: #06b6d4;
    --waiting: #a855f7;
    --radius: 14px;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 100px;
    overflow-x: hidden;
  }
  .header {
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    padding: 20px 16px 12px;
    position: sticky; top:0; z-index:100;
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .header-top {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
  }
  .logo { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
  .logo span { color: var(--accent); }
  .date-badge {
    background: var(--surface-2); border:1px solid var(--border);
    padding: 6px 14px; border-radius: 20px; font-size:13px; font-weight:600;
    color: var(--accent);
  }
  .nav-pills {
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
    scrollbar-width:none;
  }
  .nav-pills::-webkit-scrollbar { display:none; }
  .pill {
    flex-shrink:0; padding:8px 18px; border-radius:20px;
    background: var(--surface-2); border:1px solid var(--border);
    font-size:13px; font-weight:600; color: var(--text-dim);
    cursor:pointer; transition: all 0.2s; white-space:nowrap;
  }
  .pill.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .pill .count {
    display:inline-block; margin-left:6px; background:rgba(0,0,0,0.3);
    padding:2px 8px; border-radius:10px; font-size:11px;
  }
  .section { display:none; padding: 16px; animation: fadeIn 0.3s ease; }
  .section.active { display:block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
  .section-title {
    font-size:12px; text-transform:uppercase; letter-spacing:1px;
    color: var(--text-dim); margin-bottom:12px; font-weight:700;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .card {
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow); position:relative;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:active { transform: scale(0.98); }
  .card-header {
    display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px;
  }
  .card-title { font-size:16px; font-weight:700; line-height:1.3; }
  .badge-row { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; }
  .badge {
    padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; text-transform:uppercase;
    white-space:nowrap;
  }
  .badge-urgent { background: rgba(239,68,68,0.15); color: var(--urgent); border:1px solid rgba(239,68,68,0.3); }
  .badge-warning { background: rgba(249,115,22,0.15); color: var(--warning); border:1px solid rgba(249,115,22,0.3); }
  .badge-normal { background: rgba(59,130,246,0.15); color: var(--accent-2); border:1px solid rgba(59,130,246,0.3); }
  .badge-done { background: rgba(34,197,94,0.15); color: var(--success); border:1px solid rgba(34,197,94,0.3); }
  .badge-queued { background: rgba(59,130,246,0.15); color: var(--accent-2); border:1px solid rgba(59,130,246,0.3); }
  .badge-onsite { background: rgba(34,197,94,0.15); color: var(--success); border:1px solid rgba(34,197,94,0.3); }
  .badge-waiting { background: rgba(168,85,247,0.15); color: var(--waiting); border:1px solid rgba(168,85,247,0.3); }
  .card-meta {
    display:flex; flex-wrap:wrap; gap:12px; margin-bottom:10px;
    font-size:13px; color: var(--text-dim);
  }
  .meta-item { display:flex; align-items:center; gap:5px; }
  .meta-item svg { width:14px; height:14px; opacity:0.7; flex-shrink:0; }
  .meta-item a { color: inherit; text-decoration: none; }
  .meta-item a:active { color: var(--accent); }
  .card-notes {
    margin-top:8px; padding:10px 12px; border-radius:10px;
    background: var(--surface-2); border:1px solid var(--border);
    font-size:13px; color: var(--text-dim); line-height:1.4;
  }
  .card-tools {
    display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;
  }
  .tool-tag {
    background: var(--surface-2); border:1px solid var(--border);
    padding:4px 10px; border-radius:8px; font-size:12px; color: var(--text-dim);
  }
  .card-actions {
    display:flex; gap:8px; margin-top:12px; padding-top:12px;
    border-top:1px solid var(--border);
  }
  .btn {
    flex:1; padding:10px; border-radius:10px; border:none;
    font-size:13px; font-weight:700; cursor:pointer; text-align:center;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color:#000; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border:1px solid var(--border); }
  .btn-danger { background: rgba(239,68,68,0.15); color: var(--urgent); border:1px solid rgba(239,68,68,0.3); }
  .btn-success { background: rgba(34,197,94,0.15); color: var(--success); border:1px solid rgba(34,197,94,0.3); }
  .btn:active { transform: scale(0.96); opacity:0.8; }
  .btn-sm { padding:8px 12px; flex:0 0 auto; font-size:12px; }
  .filter-row {
    display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; scrollbar-width:none;
  }
  .filter-row::-webkit-scrollbar { display:none; }
  .filter-chip {
    flex-shrink:0; padding:6px 12px; border-radius:16px;
    background: var(--surface); border:1px solid var(--border);
    font-size:12px; font-weight:600; color: var(--text-dim); cursor:pointer;
  }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(245,158,11,0.1); }
  .tool-cat {
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); margin-bottom:12px; overflow:hidden;
  }
  .tool-cat-header {
    padding:14px 16px; background: var(--surface-2);
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; font-weight:700; font-size:14px;
  }
  .tool-cat-header::after {
    content: '▼'; font-size:10px; color: var(--text-dim);
    transition: transform 0.2s;
  }
  .tool-cat.collapsed .tool-cat-header::after { transform: rotate(-90deg); }
  .tool-cat.collapsed .tool-cat-body { display:none; }
  .tool-cat-body { padding:12px 16px; }
  .tool-check {
    display:flex; align-items:center; gap:10px; padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .tool-check:last-child { border-bottom:none; }
  .check-box {
    width:22px; height:22px; border-radius:6px; border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex-shrink:0; transition: all 0.15s;
  }
  .check-box.checked { background: var(--accent); border-color: var(--accent); }
  .check-box.checked::after { content: '✓'; color:#000; font-weight:800; font-size:13px; }
  .tool-check.checked span { text-decoration: line-through; opacity:0.5; }
  .fab {
    position:fixed; bottom:24px; right:24px; z-index:200;
    width:60px; height:60px; border-radius:50%;
    background: var(--accent); color:#000; border:none;
    font-size:28px; font-weight:300; cursor:pointer;
    box-shadow: 0 6px 24px rgba(245,158,11,0.4);
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.9); }
  .modal-overlay {
    position:fixed; inset:0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px); z-index:300;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.active { display:flex; }
  .modal {
    background: var(--surface); width:100%; max-width:500px;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px; max-height: 90vh; overflow-y:auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform:translateY(100%);} to { transform:translateY(0);} }
  .modal-title { font-size:20px; font-weight:800; margin-bottom:16px; }
  .form-group { margin-bottom:14px; }
  .form-label { display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; }
  .form-input, .form-select, .form-textarea {
    width:100%; padding:12px 14px; border-radius:10px;
    background: var(--surface-2); border:1px solid var(--border);
    color: var(--text); font-size:15px; font-family:inherit;
    outline:none; transition: border-color 0.2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { min-height:80px; resize:vertical; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions { display:flex; gap:10px; margin-top:20px; }
  .modal-actions .btn { padding:14px; }
  .hint {
    text-align:center; font-size:12px; color: var(--text-dim);
    padding: 8px; opacity:0.6;
  }
  .archive-card { opacity:0.75; }
  .archive-card .card-title { text-decoration: line-through; }
  .share-btn {
    background: var(--surface-2); border:1px solid var(--border);
    width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text); cursor:pointer;
  }
  .empty-state {
    text-align:center; padding: 40px 20px; color: var(--text-dim);
  }
  .empty-state svg { width:48px; height:48px; margin-bottom:12px; opacity:0.4; }
  .empty-state p { font-size:14px; }
  .toast {
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-100px);
    background: var(--surface-2); border:1px solid var(--border);
    padding:12px 24px; border-radius:12px; font-weight:600; z-index:400;
    box-shadow: var(--shadow); transition: transform 0.3s ease;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .team-line {
    font-size:12px; color: var(--text-dim); margin-top:2px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="logo">Shop<span>Flow</span></div>
      <div class="team-line">Antonio &amp; Anthony</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="date-badge" id="currentDate">Loading...</div>
      <button class="share-btn" onclick="shareBoard()" title="Share Board" aria-label="Share board">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </div>
  </div>
  <div class="nav-pills" id="navPills">
    <div class="pill active" data-tab="jobs" onclick="switchTab('jobs')">Jobs <span class="count" id="jobCount">0</span></div>
    <div class="pill" data-tab="tools" onclick="switchTab('tools')">Truck</div>
    <div class="pill" data-tab="archive" onclick="switchTab('archive')">Done <span class="count" id="archiveCount">0</span></div>
  </div>
</div>

<div class="section active" id="jobsSection">
  <div class="section-title">Active Jobs</div>
  <div class="filter-row" id="statusFilters">
    <button class="filter-chip active" data-filter="all" onclick="setStatusFilter('all')">All</button>
    <button class="filter-chip" data-filter="queued" onclick="setStatusFilter('queued')">Queued</button>
    <button class="filter-chip" data-filter="onsite" onclick="setStatusFilter('onsite')">On site</button>
    <button class="filter-chip" data-filter="waiting" onclick="setStatusFilter('waiting')">Waiting parts</button>
  </div>
  <div id="jobsList"></div>
  <div class="hint">Tap + to add a job</div>
</div>

<div class="section" id="toolsSection">
  <div class="section-title">
    <span>Truck Checklist</span>
    <button class="btn btn-ghost btn-sm" type="button" onclick="resetTruckChecklist()">Reset for today</button>
  </div>
  <div id="toolsList"></div>
  <div class="hint">Check gear before you roll. Reset clears checks for a new day.</div>
</div>

<div class="section" id="archiveSection">
  <div class="section-title">Completed Jobs</div>
  <div id="archiveList"></div>
  <div class="hint">History stays on this phone until you delete it.</div>
</div>

<button class="fab" onclick="openModal()" aria-label="Add job">+</button>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle">New Job</div>
    <form id="jobForm" onsubmit="saveJob(event)">
      <div class="form-group">
        <label class="form-label">Customer Name</label>
        <input type="text" class="form-input" id="custName" placeholder="e.g. Mike Johnson" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" class="form-input" id="custPhone" placeholder="(555) 000-0000">
        </div>
        <div class="form-group">
          <label class="form-label">Vehicle</label>
          <input type="text" class="form-input" id="custVehicle" placeholder="e.g. 2015 Mustang">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Address / Location</label>
        <input type="text" class="form-input" id="jobAddress" placeholder="123 Main St or customer notes">
      </div>
      <div class="form-group">
        <label class="form-label">Scheduled</label>
        <input type="datetime-local" class="form-input" id="jobWhen">
      </div>
      <div class="form-group">
        <label class="form-label">Job Description</label>
        <textarea class="form-textarea" id="jobDesc" placeholder="Brake pads, noise diag, oil change..." required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select class="form-select" id="jobPriority">
            <option value="urgent">Urgent</option>
            <option value="warning">Priority</option>
            <option value="normal" selected>Standard</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Who's on it</label>
          <select class="form-select" id="jobAssign">
            <option value="">Either</option>
            <option value="antonio">Antonio</option>
            <option value="anthony">Anthony</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="jobStatus">
          <option value="queued" selected>Queued</option>
          <option value="onsite">On site</option>
          <option value="waiting">Waiting parts</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tools / Parts Needed</label>
        <input type="text" class="form-input" id="jobTools" placeholder="Torque wrench, pads, scanner...">
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-textarea" id="jobNotes" placeholder="Noise only when cold, park in driveway..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Job</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg">Saved!</span></div>

<script>
const TECHS = [
  { id: 'antonio', name: 'Antonio' },
  { id: 'anthony', name: 'Anthony' }
];

const TRUCK_TOOLS = [
  {
    name: 'Daily bag',
    tools: ['Phone + charger', 'Work order / notepad', 'Gloves', 'Flashlight / headlamp', 'Shop towels', 'Hand cleaner', 'Water / snacks']
  },
  {
    name: 'Core hand tools',
    tools: ['Socket set (metric)', 'Wrench set', 'Screwdrivers / Torx / hex', 'Pliers / cutters', 'Hammer / mallet', 'Pry bars', 'Torque wrench', 'Breaker bar / impact']
  },
  {
    name: 'Undercar / fluids',
    tools: ['Floor jack + stands / ramps', 'Oil drain pan', 'Funnel set', 'Oil filter wrench', 'Brake cleaner', 'Penetrant', 'Catch bottles']
  },
  {
    name: 'Diag / electrical',
    tools: ['OBD2 scanner', 'Multimeter', 'Test light', 'Jump pack / cables', 'Battery tester', 'Wire kit / heat shrink']
  }
];

const STATUS_LABELS = {
  queued: 'Queued',
  onsite: 'On site',
  waiting: 'Waiting parts'
};

const PRIORITY_LABELS = {
  urgent: 'Urgent',
  warning: 'Priority',
  normal: 'Standard'
};

let data = {
  version: 2,
  jobs: [],
  toolCategories: TRUCK_TOOLS,
  toolState: {},
  archive: []
};

let editingId = null;
let statusFilter = 'all';

function init() {
  const saved = localStorage.getItem('shopflow_data');
  if (saved) {
    try {
      migrate(JSON.parse(saved));
    } catch (e) {}
  }
  updateDate();
  renderAll();
  setInterval(updateDate, 60000);
}

function migrate(parsed) {
  const jobs = Array.isArray(parsed.jobs) ? parsed.jobs : [];
  const archive = Array.isArray(parsed.archive) ? parsed.archive : [];

  // Deduplicate archive restore bug: drop archived copies still sitting in jobs
  const activeJobs = jobs
    .filter(j => !j.archived)
    .map(normalizeJob);

  const archiveJobs = archive.map(normalizeJob);

  const useTruckTools = !parsed.version || parsed.version < 2 || !Array.isArray(parsed.toolCategories);
  data = {
    version: 2,
    jobs: activeJobs,
    archive: archiveJobs,
    toolCategories: useTruckTools ? TRUCK_TOOLS : parsed.toolCategories,
    toolState: useTruckTools ? {} : (parsed.toolState || {})
  };
  saveData();
}

function normalizeJob(job) {
  const status = ['queued', 'onsite', 'waiting'].includes(job.status) ? job.status : 'queued';
  let assignedTo = job.assignedTo || '';
  if (assignedTo && !TECHS.some(t => t.id === assignedTo)) {
    // Map old fake crew ids loosely, otherwise clear
    const old = String(assignedTo);
    if (old === 'm1') assignedTo = 'antonio';
    else if (old === 'm2') assignedTo = 'anthony';
    else assignedTo = '';
  }
  return {
    id: job.id || ('j' + Date.now() + Math.random().toString(16).slice(2)),
    customer: job.customer || '',
    phone: job.phone || '',
    vehicle: job.vehicle || '',
    address: job.address || '',
    when: job.when || '',
    desc: job.desc || '',
    priority: ['urgent', 'warning', 'normal'].includes(job.priority) ? job.priority : 'normal',
    assignedTo,
    status,
    tools: job.tools || '',
    notes: job.notes || '',
    createdAt: job.createdAt || Date.now(),
    completedAt: job.completedAt || null
  };
}

function saveData() {
  localStorage.setItem('shopflow_data', JSON.stringify(data));
}

function updateDate() {
  const d = new Date();
  const opts = { weekday: 'short', month: 'short', day: 'numeric' };
  document.getElementById('currentDate').textContent = d.toLocaleDateString('en-US', opts);
}

function switchTab(tab) {
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.tab === tab));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === tab + 'Section'));
}

function setStatusFilter(filter) {
  statusFilter = filter;
  document.querySelectorAll('#statusFilters .filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.filter === filter);
  });
  renderJobs();
}

function techName(id) {
  return TECHS.find(t => t.id === id)?.name || '';
}

function formatWhen(when) {
  if (!when) return '';
  const d = new Date(when);
  if (Number.isNaN(d.getTime())) return when;
  return d.toLocaleString('en-US', {
    weekday: 'short', month: 'short', day: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function mapsUrl(address) {
  return 'https://maps.apple.com/?q=' + encodeURIComponent(address);
}

function renderJobs() {
  const list = document.getElementById('jobsList');
  let active = data.jobs.slice();
  document.getElementById('jobCount').textContent = active.length;

  if (statusFilter !== 'all') {
    active = active.filter(j => j.status === statusFilter);
  }

  if (!data.jobs.length) {
    list.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <p>No active jobs. Tap + to add one.</p>
      </div>`;
    return;
  }

  if (!active.length) {
    list.innerHTML = `
      <div class="empty-state">
        <p>No jobs in this status.</p>
      </div>`;
    return;
  }

  const priorityOrder = { urgent: 0, warning: 1, normal: 2 };
  active.sort((a, b) => {
    const pa = priorityOrder[a.priority] - priorityOrder[b.priority];
    if (pa !== 0) return pa;
    const wa = a.when ? new Date(a.when).getTime() : Infinity;
    const wb = b.when ? new Date(b.when).getTime() : Infinity;
    return wa - wb;
  });

  list.innerHTML = active.map(job => {
    const who = techName(job.assignedTo);
    const tools = job.tools ? job.tools.split(',').map(t => t.trim()).filter(Boolean) : [];
    return `
      <div class="card" data-id="${job.id}">
        <div class="card-header">
          <div class="card-title">${esc(job.desc)}</div>
          <div class="badge-row">
            <div class="badge badge-${job.status}">${STATUS_LABELS[job.status] || job.status}</div>
            <div class="badge badge-${job.priority}">${PRIORITY_LABELS[job.priority] || job.priority}</div>
          </div>
        </div>
        <div class="card-meta">
          <div class="meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            ${esc(job.customer)}
          </div>
          ${job.phone ? `<div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><a href="tel:${esc(job.phone)}">${esc(job.phone)}</a></div>` : ''}
          ${job.vehicle ? `<div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>${esc(job.vehicle)}</div>` : ''}
          ${job.address ? `<div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><a href="${mapsUrl(job.address)}" target="_blank" rel="noopener">${esc(job.address)}</a></div>` : ''}
          ${job.when ? `<div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${esc(formatWhen(job.when))}</div>` : ''}
          ${who ? `<div class="meta-item" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>${esc(who)}</div>` : ''}
        </div>
        ${job.notes ? `<div class="card-notes">${esc(job.notes)}</div>` : ''}
        ${tools.length ? `<div class="card-tools">${tools.map(t => `<span class="tool-tag">${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="card-actions">
          <button class="btn btn-ghost" type="button" onclick="cycleJobStatus('${job.id}')">${nextStatusLabel(job.status)}</button>
          <button class="btn btn-ghost" type="button" onclick="editJob('${job.id}')">Edit</button>
          <button class="btn btn-success" type="button" onclick="archiveJob('${job.id}')">Complete</button>
        </div>
      </div>
    `;
  }).join('');
}

function nextStatusLabel(status) {
  if (status === 'queued') return '→ On site';
  if (status === 'onsite') return '→ Waiting';
  return '→ Queued';
}

function cycleJobStatus(id) {
  const job = data.jobs.find(j => j.id === id);
  if (!job) return;
  const cycle = { queued: 'onsite', onsite: 'waiting', waiting: 'queued' };
  job.status = cycle[job.status] || 'queued';
  saveData();
  renderJobs();
  showToast(`${job.customer}: ${STATUS_LABELS[job.status]}`);
}

function renderArchive() {
  const list = document.getElementById('archiveList');
  document.getElementById('archiveCount').textContent = data.archive.length;

  if (!data.archive.length) {
    list.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="20 6 9 17 4 12"/></svg>
        <p>No completed jobs yet.</p>
      </div>`;
    return;
  }

  list.innerHTML = data.archive.slice().reverse().map(job => {
    const who = techName(job.assignedTo);
    const doneDate = job.completedAt ? new Date(job.completedAt).toLocaleDateString() : 'Recently';
    return `
      <div class="card archive-card" data-id="${job.id}">
        <div class="card-header">
          <div class="card-title">${esc(job.desc)}</div>
          <div class="badge badge-done">Done</div>
        </div>
        <div class="card-meta">
          <div class="meta-item">${esc(job.customer)} • ${esc(job.vehicle || 'No vehicle')}</div>
          ${job.address ? `<div class="meta-item">${esc(job.address)}</div>` : ''}
          ${who ? `<div class="meta-item">${esc(who)}</div>` : ''}
          <div class="meta-item">Completed: ${doneDate}</div>
        </div>
        <div class="card-actions">
          <button class="btn btn-ghost" type="button" onclick="restoreJob('${job.id}')">Restore</button>
          <button class="btn btn-danger" type="button" onclick="deleteJob('${job.id}', true)">Delete</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderTools() {
  const list = document.getElementById('toolsList');
  list.innerHTML = data.toolCategories.map((cat, ci) => {
    const checkedCount = cat.tools.filter((_, ti) => data.toolState[`${ci}-${ti}`]).length;
    const isCollapsed = checkedCount === cat.tools.length && checkedCount > 0;
    return `
      <div class="tool-cat ${isCollapsed ? 'collapsed' : ''}" id="toolCat-${ci}">
        <div class="tool-cat-header" onclick="toggleToolCat(${ci})">
          <span>${esc(cat.name)} <span style="color:var(--text-dim);font-weight:500;">(${checkedCount}/${cat.tools.length})</span></span>
        </div>
        <div class="tool-cat-body">
          ${cat.tools.map((tool, ti) => {
            const key = `${ci}-${ti}`;
            const checked = data.toolState[key] ? 'checked' : '';
            return `
              <div class="tool-check ${checked}" onclick="toggleTool('${key}')">
                <div class="check-box ${checked}"></div>
                <span>${esc(tool)}</span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function toggleToolCat(ci) {
  document.getElementById(`toolCat-${ci}`).classList.toggle('collapsed');
}

function toggleTool(key) {
  data.toolState[key] = !data.toolState[key];
  saveData();
  renderTools();
}

function resetTruckChecklist() {
  if (!confirm('Reset truck checklist for a new day?')) return;
  data.toolState = {};
  saveData();
  renderTools();
  showToast('Checklist reset');
}

function openModal(editId = null) {
  editingId = editId;
  document.getElementById('modalTitle').textContent = editId ? 'Edit Job' : 'New Job';
  document.getElementById('modalOverlay').classList.add('active');

  if (editId) {
    const job = data.jobs.find(j => j.id === editId);
    if (!job) return;
    document.getElementById('custName').value = job.customer;
    document.getElementById('custPhone').value = job.phone || '';
    document.getElementById('custVehicle').value = job.vehicle || '';
    document.getElementById('jobAddress').value = job.address || '';
    document.getElementById('jobWhen').value = job.when || '';
    document.getElementById('jobDesc').value = job.desc;
    document.getElementById('jobPriority').value = job.priority;
    document.getElementById('jobAssign').value = job.assignedTo || '';
    document.getElementById('jobStatus').value = job.status || 'queued';
    document.getElementById('jobTools').value = job.tools || '';
    document.getElementById('jobNotes').value = job.notes || '';
  } else {
    document.getElementById('jobForm').reset();
    document.getElementById('jobPriority').value = 'normal';
    document.getElementById('jobStatus').value = 'queued';
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null;
}

function saveJob(e) {
  e.preventDefault();
  const existing = editingId ? data.jobs.find(j => j.id === editingId) : null;
  const job = normalizeJob({
    id: editingId || ('j' + Date.now()),
    customer: document.getElementById('custName').value.trim(),
    phone: document.getElementById('custPhone').value.trim(),
    vehicle: document.getElementById('custVehicle').value.trim(),
    address: document.getElementById('jobAddress').value.trim(),
    when: document.getElementById('jobWhen').value,
    desc: document.getElementById('jobDesc').value.trim(),
    priority: document.getElementById('jobPriority').value,
    assignedTo: document.getElementById('jobAssign').value,
    status: document.getElementById('jobStatus').value,
    tools: document.getElementById('jobTools').value.trim(),
    notes: document.getElementById('jobNotes').value.trim(),
    createdAt: existing?.createdAt || Date.now()
  });

  if (editingId) {
    const idx = data.jobs.findIndex(j => j.id === editingId);
    if (idx >= 0) data.jobs[idx] = job;
  } else {
    data.jobs.push(job);
  }

  saveData();
  closeModal();
  renderAll();
  showToast(editingId ? 'Job updated' : 'Job added');
}

function editJob(id) {
  openModal(id);
}

function archiveJob(id) {
  const idx = data.jobs.findIndex(j => j.id === id);
  if (idx < 0) return;
  const job = data.jobs[idx];
  job.completedAt = Date.now();
  data.archive.push(job);
  data.jobs.splice(idx, 1);
  saveData();
  renderAll();
  showToast('Job completed');
}

function restoreJob(id) {
  const idx = data.archive.findIndex(j => j.id === id);
  if (idx < 0) return;
  const job = data.archive[idx];
  delete job.completedAt;
  job.status = job.status || 'queued';
  data.jobs.push(job);
  data.archive.splice(idx, 1);
  saveData();
  renderAll();
  showToast('Job restored');
}

function deleteJob(id, fromArchive = false) {
  if (!confirm('Delete permanently?')) return;
  if (fromArchive) {
    data.archive = data.archive.filter(j => j.id !== id);
  } else {
    data.jobs = data.jobs.filter(j => j.id !== id);
  }
  saveData();
  renderAll();
  showToast('Deleted');
}

function renderAll() {
  renderJobs();
  renderTools();
  renderArchive();
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function shareBoard() {
  const active = data.jobs;
  const summary = [
    `ShopFlow — ${new Date().toLocaleDateString()}`,
    `Antonio & Anthony`,
    ``,
    `Active jobs: ${active.length}`,
    `Completed: ${data.archive.length}`,
    ``,
    `--- URGENT ---`,
    ...active.filter(j => j.priority === 'urgent').map(formatShareJob),
    ``,
    `--- ON SITE ---`,
    ...active.filter(j => j.status === 'onsite').map(formatShareJob),
    ``,
    `--- WAITING PARTS ---`,
    ...active.filter(j => j.status === 'waiting').map(formatShareJob),
    ``,
    `--- QUEUED ---`,
    ...active.filter(j => j.status === 'queued').map(formatShareJob)
  ].join('\n');

  if (navigator.share) {
    try {
      await navigator.share({ title: 'ShopFlow Board', text: summary });
    } catch (e) {}
  } else {
    await navigator.clipboard.writeText(summary);
    showToast('Summary copied');
  }
}

function formatShareJob(j) {
  const who = techName(j.assignedTo);
  const bits = [
    j.customer,
    j.desc,
    j.vehicle,
    j.address,
    j.when ? formatWhen(j.when) : '',
    who
  ].filter(Boolean);
  return `• ${bits.join(' — ')}`;
}

init();
</script>
